name: Build and Push App to ECR

env:
  AWS_REGION: us-west-1
  AWS_IAM_ROLE: arn:aws:iam::023036697490:role/github-actions


on:
  push:
    branches:
    - main 
    paths:
      - "src/frontend/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        audience: sts.amazonaws.com
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ env.AWS_IAM_ROLE }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Release new version
      id: release
      run: |
        bash ./scripts/git_update.sh -v patch

    - name: Build, tag, and push Docker image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ github.repository  }}
        IMAGE_TAG: ${{ steps.release.outputs.new-tag }}
      run: |
        ECR_REPOSITORY=$(echo "$ECR_REPOSITORY" | tr '[:upper:]' '[:lower:]')

        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./src/frontend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Update image in Kubernetes manifest
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ github.repository }}
        IMAGE_TAG: ${{ steps.release.outputs.new-tag }}
      run: |
        ECR_REPOSITORY="$(echo "$ECR_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

        sed -i \
          "s|image: .*resilium:.*|image: $IMAGE|" Kubernetes-manifests/applications/frontend/frontend.yaml
    
    - name: Commit updated Kubernetes manifest
      env:
        IMAGE_TAG: ${{ steps.release.outputs.new-tag }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add Kubernetes-manifests/applications/frontend/frontend.yaml

        if git diff --cached --quiet; then
          echo "No manifest changes to commit"
          exit 0
        fi

        git commit -m "deploy(frontend): ${IMAGE_TAG}"
        git push origin HEAD:main